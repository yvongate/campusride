name: Keep Render backend awake

# Le plan gratuit Render met le service en veille apres ~15 min
# d'inactivite (reveil en 30-60s a la requete suivante) -- ce ping
# toutes les 10 min l'empeche de dormir. workflow_dispatch permet
# aussi de le declencher a la main juste avant une demo.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: curl -sf --max-time 90 https://campusride-zh7l.onrender.com/ || echo "Ping failed (le service etait peut-etre deja endormi -- reessaiera au prochain cycle)"
